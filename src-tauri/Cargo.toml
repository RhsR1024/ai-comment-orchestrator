[package]
name = "ai-comment-orchestrator"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "ai_comment_orchestrator"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
similar = "2"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2.7.1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
walkdir = "2"

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
